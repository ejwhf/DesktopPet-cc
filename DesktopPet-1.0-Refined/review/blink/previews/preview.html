<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>idle.alt · BD 主轴眨眼</title><style>body{margin:24px;background:#171f2b;color:#eaf0f8;font:16px system-ui}h1{font-size:25px}p{line-height:1.7;color:#b7c6db}button,select{padding:8px 12px;margin:4px;font:inherit;border-radius:6px;border:1px solid #56647b;background:#28384f;color:white}section{display:flex;gap:16px;flex-wrap:wrap}.card{padding:12px;border:1px solid #49586e;border-radius:10px}.light{background:#f2f0e9;color:#273244}.dark{background:#202630}canvas{display:block}input{width:min(650px,70vw)}a{color:#a8cfff}.zoom{width:752px;max-width:88vw;height:auto}details img{max-width:100%}</style><h1>idle.alt · BD 主轴眨眼</h1><p>BD 倾角 −16.45°，两眼端点保留。闭合 80 ms，停留 60 ms，睁开 160 ms，每 4 秒循环。</p><div><button id="play">暂停</button><select id="speed" aria-label="播放速度"><option value="1">正常速度</option><option value=".25">四倍慢速</option></select><button id="prev">上一帧</button><button id="next">下一帧</button><button data-state="0">原图睁眼</button><button data-state="1">轻闭</button><button data-state="2">近闭</button><button data-state="3">全闭</button></div><p id="status">正在加载</p><section><div class="card light">默认窗口对应画布 · 276px<canvas id="light" width="276" height="276"></canvas></div><div class="card dark">深色背景 · 276px<canvas id="dark" width="276" height="276"></canvas></div><div class="card">眼部放大 · 8×<canvas id="zoom" class="zoom" width="752" height="432"></canvas></div></section><p><label>开合度 <input id="openness" type="range" min="0" max="40" value="40" step="1"></label><span id="openvalue">100%</span></p><p><label>循环时间 <input id="scrub" type="range" min="0" max="3999" value="0" step="1"></label><span id="time">0 ms</span></p><details><summary>原始 512px 画布</summary><canvas id="native" width="512" height="512"></canvas></details><p><a href="blink-normal.svg">自包含 SVG</a> · <a href="blink-normal.webp">透明 WebP</a> · <a href="blink-slow.gif">慢速 GIF</a> · <a href="blink-discrete.webp">四状态节奏版</a> · <a href="eyes-dark.png">四状态放大图</a></p><details><summary>BD 与眼睑曲线对照</summary><p>绿：原图上眼线；黄：轻闭；紫：近闭；青：全闭。下图摆正仅供诊断。</p><img src="../qa/curves-original.svg"><img src="../qa/curves-rectified.svg"></details><script>const data={"seq":[{"p":0,"ms":1000,"file":"../frames/sequence/00.png","start":0,"end":1000},{"p":0.04296875,"ms":20,"file":"../frames/sequence/01.png","start":1000,"end":1020},{"p":0.31640625,"ms":20,"file":"../frames/sequence/02.png","start":1020,"end":1040},{"p":0.68359375,"ms":20,"file":"../frames/sequence/03.png","start":1040,"end":1060},{"p":0.95703125,"ms":20,"file":"../frames/sequence/04.png","start":1060,"end":1080},{"p":1,"ms":20,"file":"../frames/sequence/05.png","start":1080,"end":1100},{"p":1,"ms":20,"file":"../frames/sequence/06.png","start":1100,"end":1120},{"p":1,"ms":20,"file":"../frames/sequence/07.png","start":1120,"end":1140},{"p":0.98876953125,"ms":20,"file":"../frames/sequence/08.png","start":1140,"end":1160},{"p":0.90771484375,"ms":20,"file":"../frames/sequence/09.png","start":1160,"end":1180},{"p":0.76806640625,"ms":20,"file":"../frames/sequence/10.png","start":1180,"end":1200},{"p":0.59326171875,"ms":20,"file":"../frames/sequence/11.png","start":1200,"end":1220},{"p":0.40673828125,"ms":20,"file":"../frames/sequence/12.png","start":1220,"end":1240},{"p":0.23193359375,"ms":20,"file":"../frames/sequence/13.png","start":1240,"end":1260},{"p":0.09228515625,"ms":20,"file":"../frames/sequence/14.png","start":1260,"end":1280},{"p":0.01123046875,"ms":20,"file":"../frames/sequence/15.png","start":1280,"end":1300},{"p":0,"ms":2700,"file":"../frames/sequence/16.png","start":1300,"end":4000}],"states":["../frames/open.png","../frames/light.png","../frames/near.png","../frames/closed.png"],"slider":["../frames/slider/00.png","../frames/slider/01.png","../frames/slider/02.png","../frames/slider/03.png","../frames/slider/04.png","../frames/slider/05.png","../frames/slider/06.png","../frames/slider/07.png","../frames/slider/08.png","../frames/slider/09.png","../frames/slider/10.png","../frames/slider/11.png","../frames/slider/12.png","../frames/slider/13.png","../frames/slider/14.png","../frames/slider/15.png","../frames/slider/16.png","../frames/slider/17.png","../frames/slider/18.png","../frames/slider/19.png","../frames/slider/20.png","../frames/slider/21.png","../frames/slider/22.png","../frames/slider/23.png","../frames/slider/24.png","../frames/slider/25.png","../frames/slider/26.png","../frames/slider/27.png","../frames/slider/28.png","../frames/slider/29.png","../frames/slider/30.png","../frames/slider/31.png","../frames/slider/32.png","../frames/slider/33.png","../frames/slider/34.png","../frames/slider/35.png","../frames/slider/36.png","../frames/slider/37.png","../frames/slider/38.png","../frames/slider/39.png","../frames/slider/40.png"]};
let playing=true,ready=false,clock=0,last=performance.now(),frame=0;const el=id=>document.getElementById(id),make=f=>{let im=new Image();im.src=f;return im},images=data.seq.map(s=>make(s.file)),states=data.states.map(make),slider=data.slider.map(make);
function draw(im){for(const id of['light','dark','native']){const c=el(id),x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);}const c=el('zoom'),x=c.getContext('2d');x.clearRect(0,0,752,432);x.imageSmoothingEnabled=true;x.drawImage(im,207,190,94,54,0,0,752,432);}
function pause(){playing=false;el('play').textContent='播放'}
function atTime(){frame=Math.max(0,data.seq.findIndex(s=>clock>=s.start&&clock<s.end));draw(images[frame]);el('scrub').value=Math.floor(clock);el('time').textContent=Math.floor(clock)+' ms';el('status').textContent=(playing?'循环播放':'暂停')+' · 第 '+(frame+1)+' / '+images.length+' 帧';el('openness').value=Math.round((1-data.seq[frame].p)*40);el('openvalue').textContent=((1-data.seq[frame].p)*100).toFixed(1)+'%';}
el('play').onclick=()=>{playing=!playing;el('play').textContent=playing?'暂停':'播放';last=performance.now();if(playing)atTime()};
el('scrub').oninput=()=>{pause();clock=+el('scrub').value;atTime()};
el('openness').oninput=()=>{pause();const q=+el('openness').value;draw(slider[40-q]);el('openvalue').textContent=(q/40*100).toFixed(1)+'%';el('status').textContent='开合度检查'};
document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>{pause();draw(states[+b.dataset.state]);el('status').textContent=b.textContent;const p=[0,.35,.78,1][+b.dataset.state];el('openness').value=Math.round((1-p)*40);el('openvalue').textContent=((1-p)*100).toFixed(0)+'%';});
function step(delta){pause();frame=(frame+delta+images.length)%images.length;clock=data.seq[frame].start;atTime()}el('prev').onclick=()=>step(-1);el('next').onclick=()=>step(1);
function tick(now){if(ready&&playing){clock=(clock+(now-last)*(+el('speed').value))%4000;atTime()}last=now;requestAnimationFrame(tick)}
Promise.all([...images,...states,...slider].map(i=>i.decode())).then(()=>{ready=true;window.previewReady=true;atTime();requestAnimationFrame(tick)}).catch(e=>el('status').textContent='加载失败：'+e.message);
</script></html>
